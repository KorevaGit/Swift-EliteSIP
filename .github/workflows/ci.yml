# Проверка каждого изменения на чужой машине. M7e, пункт 5.
#
# Смысл именно в чужой машине. На машине разработки собирается всё: там стоят
# нужные версии, лежат некоммитимые файлы и остались артефакты прошлых сборок.
# Ровно поэтому «у меня работает» ничего не значит про свежий клон, а свежий
# клон — это то, с чего начинается любая приёмка и любой новый участник.
#
# Что здесь НЕ делается — подпись и нотарификация. Секреты выпуска (сертификат
# Developer ID, профиль notarytool, ключ Sparkle) остаются на машине выпуска и в
# облако не уезжают: канал выпуска, доступный из CI, — это канал доставки чего
# угодно на все рабочие места сразу. Выпуск гонит Tools/release.sh руками.

name: Проверки

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: Совместимость и тесты
    # Образ и Xcode закреплены оба (1 октября 2026). Xcode 27 держит нижнюю
    # планку 12.0 и срез x86_64 под Catalina не собирает вовсе — см.
    # docs/release.md, «Xcode 27 не собирает под Catalina». `macos-latest`
    # однажды приедет с Xcode 27 по умолчанию, и CI покраснеет не из-за кода.
    # Выпуск собирается тем же 26.6 (DEVELOPER_DIR на машине выпуска), так что
    # CI проверяет ровно тот компилятор, которым выходит сборка. Поднимать
    # версию — только вместе с машиной выпуска.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Версия инструментов
        # Не для красоты: если образ однажды уберёт Xcode 26.6, падать надо
        # здесь и с понятной строкой, а не на сборке пакетов.
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::нет $DEVELOPER_DIR — на образе раннера больше нет Xcode 26.6"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Заглушка провижининга
        # Release-сборка намеренно падает без Config/provisioning.local.json
        # (M7e, пункт 7), а настоящий файл в Git не лежит и в CI попасть не
        # должен. Здесь подставляется заведомо ненастоящий: собранное в CI
        # приложение никуда не раздаётся, оно только доказывает, что код
        # компилируется и линкуется под оба среза.
        #
        # Набор ключей обязан совпадать с тем, что требует
        # Tools/embed-provisioning.sh. С M7h там обязателен блок «updates», а
        # заглушка его не несла: Release в CI падал с 20 августа по 30 сентября
        # 2026, и красный прогон стал фоном, на котором настоящей поломки уже не
        # видно. Адрес — заведомо несуществующий домен .invalid (RFC 6761).
        run: |
          cat > Config/provisioning.local.json <<'JSON'
          {
            "adminPassword": "ci-не-настоящий-пароль",
            "updates": {
              "baseURL": "https://updates.ci.invalid",
              "user": "ci",
              "password": "ci-не-настоящий-пароль"
            }
          }
          JSON

      - name: Совместимость, тесты восьми пакетов и universal-сборка
        run: Tools/check-compat.sh

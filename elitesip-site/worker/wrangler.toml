# Worker перед бакетом EliteSIP.
#
# Зависимостей нет и сборки нет: `main` указывает прямо на исходник, и то, что
# лежит в репозитории, — это ровно то, что выполняется в Cloudflare.

# Имя того же Worker'а, что раздаёт обновления с 20 августа 2026. Этап 5 не
# ставит второй, а дополняет этот: бакет один, и хостнейм get.elitesip.vip уже
# заведён под него и провижинится приложению вместе с Basic-парой. Второй
# Worker означал бы второй хостнейм и вторую пару в бандле.
name = "elitesip-updates"
main = "worker.js"
compatibility_date = "2026-08-24"

# Своего поддомена workers.dev у Worker'а нет: он живёт на get.elitesip.vip,
# и маршрут заведён отдельно от wrangler. Выключено явно, чтобы выкладка не
# пыталась завести поддомен и не трогала маршрутизацию.
#
# Строка обязана стоять **до** таблиц вроде `[[r2_buckets]]`: в TOML всё, что
# написано после заголовка таблицы, принадлежит ей. Стояла она внизу и потому
# читалась как поле бакета — то есть не действовала вовсе. Нашлось при первой
# же выкладке 26 августа 2026, wrangler сказал об этом предупреждением.
workers_dev = false

# Тот же бакет, куда панель выкладывает файл предустановок и пакеты активации.
# Другого хранилища у Worker'а нет намеренно — см. шапку worker.js.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "elitesip-updates"

# AUTH_USER и AUTH_PASS — секреты, заданные при первой выкладке канала
# обновлений. Они переживают выкладку и здесь не объявляются: в файле пара
# оказалась бы в репозитории.


[observability]
enabled = true

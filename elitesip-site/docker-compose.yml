# Панель EliteSIP на локальном сервере конторы.
#
# Наружу не смотрит. Имя `support.elitesip.vip` разрешается в 10.171.0.171 —
# адрес частной сети, — то есть снаружи по нему не достучаться вовсе, а внутри
# он даёт человеческий адрес вместо цифр. Решение о размещении внутри — в
# docs/DECISIONS.md.

services:
  panel:
    build: .
    restart: unless-stopped

    # Портов панель не публикует вовсе.
    #
    # До неё дотягивается только Caddy, по внутренней сети compose. Открыть
    # панель в сеть напрямую — отдельное решение, которое должно приниматься
    # руками, а не достаться по умолчанию из этого файла.
    expose:
      - "8080"

    environment:
      ELITESIP_LISTEN: "0.0.0.0:8080"
      ELITESIP_DB: "/data/panel.db"

      # Секреты — путями к файлам, а не значениями: значение видно в
      # `docker inspect` и в списке процессов.
      ELITESIP_SIGNING_KEY_FILE: "/secrets/signing.key"
      ELITESIP_SECRET_FILE: "/secrets/server.secret"

      ELITESIP_R2_ENDPOINT: "${ELITESIP_R2_ENDPOINT}"
      ELITESIP_R2_BUCKET: "${ELITESIP_R2_BUCKET}"
      ELITESIP_R2_ACCESS_KEY_ID: "${ELITESIP_R2_ACCESS_KEY_ID}"
      ELITESIP_R2_SECRET_ACCESS_KEY: "${ELITESIP_R2_SECRET_ACCESS_KEY}"

    volumes:
      - ./data:/data
      # Только на чтение: панель свои секреты не переписывает.
      - ./secrets:/secrets:ro

    healthcheck:
      # Отвечает после того, как база открыта и схема доведена до текущей
      # версии, — «жив» здесь значит «готов работать».
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Caddy перед панелью: даёт имя вместо адреса и место, куда позже встанет TLS.
  #
  # Отдельным контейнером, а не строкой в панели, по той же причине, по какой
  # Worker стоит перед бакетом: панель занимается своим делом и не обязана
  # знать ни про имена, ни про сертификаты.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - panel

    environment:
      # Токен правки DNS зоны elitesip.vip — им Caddy доказывает владение
      # именем при выпуске и продлении сертификата. Значением из `.env`,
      # который лежит правами 600 и в Git не попадает.
      CF_API_TOKEN: "${CF_API_TOKEN}"

    ports:
      # 80 остаётся ради перенаправления на https и ради тех, кто наберёт
      # адрес по памяти. Сама панель за ним не отвечает.
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ./logs/caddy:/var/log/caddy

volumes:
  caddy-data:
  caddy-config:

{{define "content"}}
{{$d := .Data}}
<div class="card">
    <div class="card-head">
        <div class="card-head-copy">
            <h2>{{$d.Name}}</h2>
            <p class="card-note">Раздел в разработке.</p>
        </div>
    </div>
    <div class="card-body">
        <p class="card-note">{{$d.About}}</p>
        {{if $d.Plans}}
        <p class="field-label">Что здесь появится</p>
        <ul class="card-note">
            {{range $d.Plans}}<li>{{.}}</li>{{end}}
        </ul>
        {{end}}
    </div>
</div>
{{end}}

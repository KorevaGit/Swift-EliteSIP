{{define "content"}}
<div class="login">
    <div class="login-card">
        <img class="brand-mark" src="/static/app-icon.png" alt="EliteSIP">
        <div>
            <h1>Первый вход</h1>
            <p class="card-note">
                В панели ещё нет ни одного администратора. Заведите себя —
                после этого эта страница закроется.
            </p>
        </div>

        {{if .Data}}
        <div class="notice notice-bad"><p>{{.Data}}</p></div>
        {{end}}

        <form method="post" action="/setup">
            <div class="field">
                <label for="login">Имя</label>
                <input id="login" name="login" type="text" autocomplete="username" autofocus required>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
                <span class="field-hint">Не короче восьми знаков. За этим паролем лежат SIP-пароли всей конторы.</span>
            </div>
            <button type="submit" class="button button-primary">Завести и войти</button>
        </form>
    </div>
</div>
{{end}}

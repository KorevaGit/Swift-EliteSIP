{{define "content"}}
<div class="login">
    <div class="login-card">
        <img class="brand-mark" src="/static/brand-mark.png" alt="" aria-hidden="true">
        <div>
            <h1>Элитная поддержка</h1>
            <p class="card-note">Панель техподдержки</p>
        </div>

        {{if .Data}}
        <div class="notice notice-bad"><p>{{.Data}}</p></div>
        {{end}}

        <form method="post" action="/login">
            <input type="hidden" name="csrf" value="{{$.CSRF}}">
            <div class="field">
                <label for="login">Имя</label>
                <input id="login" name="login" type="text" autocomplete="username" autofocus required>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="button button-primary">Войти</button>
        </form>
    </div>
</div>
{{end}}

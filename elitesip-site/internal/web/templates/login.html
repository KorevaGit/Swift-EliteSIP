{{define "content"}}
<div class="login">
    <div class="login-card">
        <span class="brand-mark" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </span>
        <div>
            <h1>Панель EliteSIP</h1>
            <p class="card-note">Управление рабочими местами</p>
        </div>

        {{if .Data}}
        <div class="notice notice-bad"><p>{{.Data}}</p></div>
        {{end}}

        <form method="post" action="/login">
            <div class="field">
                <label for="login">Имя</label>
                <input id="login" name="login" type="text" autocomplete="username" autofocus required>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="button button-primary">Войти</button>
        </form>
    </div>
</div>
{{end}}

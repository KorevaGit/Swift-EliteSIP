[general]
; Диапазон должен совпадать с публикацией портов в docker-compose.yml. Боевой
; `rtp show settings` (31 июля 2026) держит 12000–22000 — шире не нужно на
; локальном стенде, диапазон size здесь не про совместимость, а про то,
; сколько портов пробрасывает Docker.
rtpstart=10000
rtpend=10030

; Подтвердилось боевым `rtp show settings` 31 июля 2026 — раньше явно не
; выставлялось.
strictrtp=yes
probation=4

; icesupport=yes тоже стоял в боевом выводе, но здесь эффекта не даёт: этот
; Asterisk собран без pjproject/pjnath (see Dockerfile), `rtp show settings`
; после включения строку ICE support вообще не печатает — проверено на живом
; контейнере. Не включаю параметр, чтобы не создавать видимость поддержки,
; которой в этой сборке нет.

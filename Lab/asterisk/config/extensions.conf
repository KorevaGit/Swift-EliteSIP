[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[internal]

; --- Тестовые цели для медиа ------------------------------------------------

; 600 — эхо. Основная цель M2: слышно себя => путь RTP туда-обратно живой.
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

; 601 — односторонний звук. Отделяет "не работает приём" от "не работает передача".
exten => 601,1,NoOp(Playback test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; 602 — тон 1004 Гц. Для замера искажений и проверки джиттер-буфера на слух.
exten => 602,1,NoOp(Milliwatt tone)
 same => n,Answer()
 same => n,Milliwatt()

; 603 — говорит обратно то, что ввели DTMF. Проверка RFC2833 в M4.
exten => 603,1,NoOp(DTMF readback)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Read(DIGITS,beep,10,,1,10)
 same => n,SayDigits(${DIGITS})
 same => n,Hangup()

; --- Конференция ------------------------------------------------------------

; 8000 — комната по умолчанию, _80XX — комната с номером из последних двух цифр.
exten => 8000,1,NoOp(ConfBridge default room)
 same => n,Answer()
 same => n,ConfBridge(1,default_bridge,default_user)
 same => n,Hangup()

exten => _80XX,1,NoOp(ConfBridge room ${EXTEN:2})
 same => n,Answer()
 same => n,ConfBridge(${EXTEN:2},default_bridge,default_user)
 same => n,Hangup()

; --- Внутренние номера -----------------------------------------------------
; Флаги tT обязательны: без них DTMF-переводы из features.conf не работают,
; а нам надо тестировать и REFER, и серверные коды.

exten => _10X,1,NoOp(Dial SIP/${EXTEN})
 same => n,Dial(SIP/${EXTEN},30,tT)
 same => n,Hangup()

exten => 200,1,NoOp(Dial secure peer)
 same => n,Dial(SIP/200,30,tT)
 same => n,Hangup()

; --- Заглушка "горячей раздачи" --------------------------------------------
; Боевой код перевода выглядит как *022998#, то есть 22998 — реальная цель.
; Здесь она отвечает и молчит, чтобы было куда переводить в M5.
exten => 22998,1,NoOp(Hot queue stub)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-thanks)
 same => n,Wait(60)
 same => n,Hangup()

exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()

exten => t,1,Hangup()

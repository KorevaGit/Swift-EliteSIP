[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[internal]

; --- Тестовые цели для медиа ------------------------------------------------

; 600 — эхо. Основная цель M2: слышно себя => путь RTP туда-обратно живой.
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

; 601 — односторонний звук. Отделяет "не работает приём" от "не работает передача".
exten => 601,1,NoOp(Playback test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; 602 — тон 1004 Гц. Для замера искажений и проверки джиттер-буфера на слух.
exten => 602,1,NoOp(Milliwatt tone)
 same => n,Answer()
 same => n,Milliwatt()

; 603 — говорит обратно то, что ввели DTMF. Проверка RFC2833 в M4.
exten => 603,1,NoOp(DTMF readback)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Read(DIGITS,beep,10,,1,10)
 same => n,SayDigits(${DIGITS})
 same => n,Hangup()

; --- Цели для перевода ------------------------------------------------------
;
; Перевести можно только канал, у которого ЕСТЬ собеседник. Канал внутри
; приложения (600, 602, 22998) собеседника не имеет: он разговаривает с
; Echo() или Playback(), а не с другим каналом, и Asterisk 13 на REFER по нему
; отвечает NOTIFY с 503 Service Unavailable — и на слепой перевод, и на
; консультационный с Replaces. Со стороны клиента это выглядит как «сервер не
; умеет переводить», хотя умеет.
;
; Local-канал даёт настоящий мост без единого NAT-обхода: вторая половина пары
; уходит в тот же диалплан и там уже занимается приложением. Дозвон обратно на
; зарегистрированный softphone для этого не нужен — а он на Docker Desktop
; ненадёжен: внешний порт клиента меняется чуть ли не на каждой датаграмме, и
; INVITE от Asterisk уходит на устаревшую привязку.

; 700 — эхо за мостом. Цель для проверки перевода: слышно себя, и канал
;       при этом в bridge.
exten => 700,1,NoOp(Bridged echo)
 same => n,Dial(Local/600@internal,30)
 same => n,Hangup()

; 701 — тон 1004 Гц за мостом. Второй участник перевода: по тону сразу слышно,
;       к кому именно попал переведённый собеседник.
exten => 701,1,NoOp(Bridged milliwatt)
 same => n,Dial(Local/602@internal,30)
 same => n,Hangup()

; 702 — приветствие за мостом. Третья цель, когда нужны три разных на слух.
exten => 702,1,NoOp(Bridged playback)
 same => n,Dial(Local/22998@internal,30)
 same => n,Hangup()

; --- Конференция ------------------------------------------------------------

; 8000 — комната по умолчанию, _80XX — комната с номером из последних двух цифр.
exten => 8000,1,NoOp(ConfBridge default room)
 same => n,Answer()
 same => n,ConfBridge(1,default_bridge,default_user)
 same => n,Hangup()

exten => _80XX,1,NoOp(ConfBridge room ${EXTEN:2})
 same => n,Answer()
 same => n,ConfBridge(${EXTEN:2},default_bridge,default_user)
 same => n,Hangup()

; --- Внутренние номера -----------------------------------------------------
;
; Флаги tT обязательны: без них DTMF-переводы из features.conf не работают,
; а нам надо тестировать и REFER, и серверные коды.
;
; Флаг g нужен для прототипа конференции по *3: когда собеседник уходит в
; ConfBridge, Dial завершается, и выполнение продолжается со следующего
; приоритета, где в ту же комнату заходит агент. Побочный эффект: сюда же
; попадаем при обычном отбое собеседника, поэтому перед входом в комнату
; проверяем, есть ли там кто-нибудь.
;
; __CONFROOM с двумя подчёркиваниями — чтобы имя комнаты унаследовал канал
; собеседника: applicationmap выполняет ConfBridge именно на нём.

exten => _10X,1,NoOp(Dial SIP/${EXTEN})
 same => n,Set(__CONFROOM=conf-${CALLERID(num)})
 same => n,Set(__DYNAMIC_FEATURES=conf_pull)
 same => n,Dial(SIP/${EXTEN},30,gtT)
 same => n,GotoIf($[${CONFBRIDGE_INFO(parties,${CONFROOM})} > 0]?join:done)
 same => n(join),NoOp(Собеседник ушёл в конференцию ${CONFROOM}, заходим следом)
 same => n,ConfBridge(${CONFROOM},default_bridge,admin_user)
 same => n(done),Hangup()

exten => 200,1,NoOp(Dial secure peer)
 same => n,Set(__CONFROOM=conf-${CALLERID(num)})
 same => n,Set(__DYNAMIC_FEATURES=conf_pull)
 same => n,Dial(SIP/200,30,gtT)
 same => n,GotoIf($[${CONFBRIDGE_INFO(parties,${CONFROOM})} > 0]?join:done)
 same => n(join),ConfBridge(${CONFROOM},default_bridge,admin_user)
 same => n(done),Hangup()

; --- Заглушка "горячей раздачи" --------------------------------------------
; Боевой код перевода выглядит как *022998#, то есть 22998 — реальная цель.
; Здесь она отвечает и молчит, чтобы было куда переводить в M5.
exten => 22998,1,NoOp(Hot queue stub)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-thanks)
 same => n,Wait(60)
 same => n,Hangup()

exten => i,1,Playback(pbx-invalid)
 same => n,Hangup()

exten => t,1,Hangup()

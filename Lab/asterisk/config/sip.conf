; chan_sip — не chan_pjsip. Так настроен боевой Asterisk, поэтому и лаба такая же.
;
; Docker Desktop на macOS: контейнер за NAT, его адрес в сети docker с хоста
; недостижим. Любой клиент — и на самом Mac, и телефон в локальной сети —
; обязан получить в SDP externaddr, а не внутренний адрес контейнера. Как это
; достигается и почему именно так, разобрано у самого localnet ниже: место
; неочевидное, и наступали на него дважды.

[general]
context=internal
allowguest=no
alwaysauthreject=yes
srvlookup=no
useragent=Asterisk-EliteSIP-Lab

udpbindaddr=0.0.0.0:5060
tcpenable=no

tlsenable=yes
tlsbindaddr=0.0.0.0:5061
tlscertfile=/etc/asterisk/keys/asterisk.pem
tlsprivatekey=/etc/asterisk/keys/asterisk.pem
tlscipher=ALL
tlsdontverifyserver=yes

; Порядок кодеков сверен с боевым `sip show settings` 31 июля 2026: там
; `(ulaw|alaw|gsm|g726|g722)` — ulaw первым, g722 последним. Раньше здесь стоял
; обратный порядок в расчёте на широкую полосу; теперь известно, что это не
; сработает против боя: Asterisk как SDP-answerer выбирает кодек по СВОЕЙ
; allow-очереди, а не по порядку предложения клиента, — так что даже если
; клиент предложит g722 первым, сервер всё равно возьмёт ulaw. Разбор — в
; docs/audio.md, раздел «G.722».
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=g726
allow=g722

dtmfmode=rfc2833
directmedia=no
videosupport=no
textsupport=no

; force_rport,comedia — то же самое, что боевой peer показывает как
; `Force rport: Yes` / `Symmetric RTP: Yes` (современные имена той же пары
; настроек). Совпадает, менять не пришлось.
nat=force_rport,comedia

; localnet объявлен диапазоном, в который не попадает НИ ОДИН пир, и это не
; описка. Здесь два неочевидных факта, и оба проверены на живом Asterisk.
;
; Первый: Docker Desktop переписывает адрес источника. И клиент на самом Mac, и
; телефон в локальной сети приходят к Asterisk с адреса шлюза 172.20.0.1 —
; `sip show peers` показывает его у всех. Значит разделить пиров по адресу
; нельзя в принципе: снаружи они неразличимы.
;
; Второй: прежнее `localnet=172.16.0.0/12` этот шлюз накрывало. Asterisk считал
; всех локальными, клал в SDP свой 172.20.0.2 — адрес, до которого с macOS
; маршрута нет, — и разговор устанавливался целиком, а звука не было ни в одну
; сторону (`принято 0`, затем BYE). Симптом выглядит как поломка аудиотракта,
; хотя это одна строка в SDP.
;
; Убрать localnet совсем — не решение, хотя напрашивается: chan_sip включает
; подстановку externaddr ТОЛЬКО при непустом списке. Без него
; `sip show settings` честно пишет «SIP address remapping: Disabled, no localnet
; list», и в SDP снова уходит внутренний адрес. Проверено — именно так и вышло.
;
; Поэтому список непустой, но заведомо ни с чем не совпадающий: он существует
; ради того, чтобы включить подстановку, а не чтобы кого-то пометить локальным.
; 127.0.0.0/8 подходит потому, что через SNAT оттуда не придёт никогда никто.
localnet=127.0.0.0/8

; Дальше — то, что подтвердилось боевым `sip show settings` 31 июля 2026 и
; раньше в лабе не было выставлено явно.
allowoverlap=yes
progressinband=yes
; `qualifyfreq` в конфиге — секунды, а `sip show settings` печатает то же самое
; в миллисекундах. Боевые «Qualify Freq: 60000 ms» — это и есть 60 секунд,
; то есть штатное значение по умолчанию, а не 60000 секунд: проверено на
; живом лабораторном контейнере после первой (ошибочной) правки.
qualifyfreq=60
session-timers=accept
session-expires=1800
session-minse=90
session-refresher=uas
rtptimeout=30
rtpholdtimeout=300
rtpkeepalive=10
tos_sip=cs3
tos_audio=ef
tos_video=af41
cos_sip=4
cos_audio=5
cos_video=6

; Адрес, который Asterisk ставит в SDP и Contact для «внешних» клиентов.
;
; Должен быть адресом Mac в локальной сети, а не 127.0.0.1: телефон в той же
; сети отправит медиа именно туда, куда здесь написано, и с петлевым адресом
; отправит его сам себе. Для клиента на самом Mac подходит и то и другое —
; свой LAN-адрес он тоже видит.
;
; При смене сети адрес меняется, и эту строку надо править. Текущий берётся
; так:  ipconfig getifaddr en0
externaddr=10.171.3.84

allowtransfer=yes
notifyhold=yes
notifyringing=yes
qualify=yes

; ---------------------------------------------------------------------------
; Профиль для отладки: UDP, открытый RTP. Читается в Wireshark, и это главное
; на этапах M1–M2 — глазами видеть, что реально уходит в сеть.
; ---------------------------------------------------------------------------
[dev-udp](!)
type=friend
host=dynamic
context=internal
; Тот же порядок, что в [general] — боевой `(ulaw|alaw|gsm|g726|g722)`.
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=g726
allow=g722
dtmfmode=rfc2833
directmedia=no
nat=force_rport,comedia
transport=udp
encryption=no
qualify=yes

[100](dev-udp)
secret=elite100
callerid="Agent 100" <100>

[101](dev-udp)
secret=elite101
callerid="Agent 101" <101>

[102](dev-udp)
secret=elite102
callerid="Agent 102" <102>

; ---------------------------------------------------------------------------
; Профиль TLS + обязательный SRTP. Цель для M2b — но НЕ то, что развёрнуто на
; бою: боевой `sip show settings` 31 июля 2026 показал `TLS SIP Bindaddress:
; Disabled`, а зарегистрированный тестовый пир — `Encryption: No`. TLS/SRTP
; остаётся поддерживаемым клиентом профилем, но подтверждённо не боевым; этот
; пир существует для проверки самого механизма, а не для повторения боя.
; В chan_sip encryption=yes означает СТРОГО шифрованно — если клиент не умеет
; SRTP, звонок отвалится. Промежуточного "optimistic" здесь нет, поэтому и
; держим два отдельных пира вместо одного переключателя.
; ---------------------------------------------------------------------------
[200]
type=friend
host=dynamic
context=internal
secret=elite200
callerid="Agent 200 secure" <200>
; Тот же порядок, что в [general] — боевой `(ulaw|alaw|gsm|g726|g722)`.
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=g726
allow=g722
dtmfmode=rfc2833
directmedia=no
nat=force_rport,comedia
transport=tls
encryption=yes
qualify=yes

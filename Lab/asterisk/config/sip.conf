; chan_sip — не chan_pjsip. Так настроен боевой Asterisk, поэтому и лаба такая же.
;
; Docker Desktop на macOS: контейнер за NAT, его 172.17.x.x с хоста недостижим.
; Поэтому localnet объявляем ТОЛЬКО для внутренней сети docker, а клиент на хосте
; (приходит с адреса шлюза 192.168.65.x) считается внешним — и в SDP ему уходит
; externaddr=127.0.0.1, то есть опубликованные порты. Если добавить сюда
; localnet=192.168.0.0/16, Asterisk решит, что хост "локальный", отдаст в SDP
; свой 172.17.x.x, и звук пропадёт в одну сторону. Не добавлять.

[general]
context=internal
allowguest=no
alwaysauthreject=yes
srvlookup=no
useragent=Asterisk-EliteSIP-Lab

udpbindaddr=0.0.0.0:5060
tcpenable=no

tlsenable=yes
tlsbindaddr=0.0.0.0:5061
tlscertfile=/etc/asterisk/keys/asterisk.pem
tlsprivatekey=/etc/asterisk/keys/asterisk.pem
tlscipher=ALL
tlsdontverifyserver=yes

disallow=all
allow=ulaw
allow=alaw

dtmfmode=rfc2833
directmedia=no
videosupport=no

nat=force_rport,comedia
localnet=172.16.0.0/12
externaddr=127.0.0.1

allowtransfer=yes
notifyhold=yes
notifyringing=yes
qualify=yes
qualifyfreq=30

; ---------------------------------------------------------------------------
; Профиль для отладки: UDP, открытый RTP. Читается в Wireshark, и это главное
; на этапах M1–M2 — глазами видеть, что реально уходит в сеть.
; ---------------------------------------------------------------------------
[dev-udp](!)
type=friend
host=dynamic
context=internal
disallow=all
allow=ulaw
allow=alaw
dtmfmode=rfc2833
directmedia=no
nat=force_rport,comedia
transport=udp
encryption=no
qualify=yes

[100](dev-udp)
secret=elite100
callerid="Agent 100" <100>

[101](dev-udp)
secret=elite101
callerid="Agent 101" <101>

[102](dev-udp)
secret=elite102
callerid="Agent 102" <102>

; ---------------------------------------------------------------------------
; Профиль "как на бою": TLS + обязательный SRTP. Цель для M2b.
; В chan_sip encryption=yes означает СТРОГО шифрованно — если клиент не умеет
; SRTP, звонок отвалится. Промежуточного "optimistic" здесь нет, поэтому и
; держим два отдельных пира вместо одного переключателя.
; ---------------------------------------------------------------------------
[200]
type=friend
host=dynamic
context=internal
secret=elite200
callerid="Agent 200 secure" <200>
disallow=all
allow=ulaw
allow=alaw
dtmfmode=rfc2833
directmedia=no
nat=force_rport,comedia
transport=tls
encryption=yes
qualify=yes

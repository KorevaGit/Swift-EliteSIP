[general]
transferdigittimeout=5
atxfernoanswertimeout=15
atxferdropcall=no
atxferloopdelay=10
atxfercallbackretries=2

; ---------------------------------------------------------------------------
; ПРОТОТИП боевых фич-кодов.
;
; Боевые конфиги недоступны, поэтому поведение восстановлено по виду самих
; кодов. Это догадка, а не копия — но догадка рабочая и проверяемая, и клиенту
; в M4–M6 нужна именно цель для отправки DTMF, а не точный серверный диалплан.
; Когда доступ появится, заменить на настоящее.
; ---------------------------------------------------------------------------

[featuremap]
; *022998# — это почти наверняка штатный blindxfer с кодом *0: Asterisk после
; кода сам собирает цифры до '#' (или до transferdigittimeout) и переводит.
; То есть весь код целиком набирается как DTMF, а разбирает его сервер.
blindxfer => *0

atxfer => *2
automixmon => *1
; disconnect уведён на *9 по двум причинам: код, начинающийся с *0, перехватывал
; бы перевод выше, а *8 занят штатным Pickup.
disconnect => *9

[applicationmap]
; *3 — конференция. Одной строкой «затащить оба конца в комнату» в диалплане
; не выражается, поэтому схема двухходовая:
;
;   1. ActivateOn=peer — приложение выполняется на канале собеседника, и он
;      уходит в комнату ${CONFROOM} (переменная унаследована от канала агента,
;      она объявлена через __ в extensions.conf).
;   2. У агента Dial стоит с флагом g, поэтому после ухода собеседника
;      выполнение продолжается со следующего приоритета, где агент заходит в
;      ту же комнату.
;
; Отличить «собеседник ушёл в конференцию» от «собеседник положил трубку»
; помогает CONFBRIDGE_INFO(parties): в первом случае в комнате уже кто-то есть.
conf_pull => *3,peer,ConfBridge,${CONFROOM}

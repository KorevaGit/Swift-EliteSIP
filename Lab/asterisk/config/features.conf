[general]
transferdigittimeout=5
atxfernoanswertimeout=15
atxferdropcall=no
atxferloopdelay=10
atxfercallbackretries=2

; ---------------------------------------------------------------------------
; Коды сверены с боевым сервером 30 июля 2026 (`core show features`, разбор —
; Lab/README.md#боевые-фич-коды-что-подтвердилось-а-что-нет). Подтвердились
; только числа для builtin-фич; что стоит за боевыми dynamic-фичами
; (`apprecord`, `cancel-transfer`) и есть ли на бою конференция через DTMF
; вообще — неизвестно. Клиента расхождение прежних догадок не касалось:
; перевод (M5) уходит через SIP REFER, а не эти коды.
; ---------------------------------------------------------------------------

[featuremap]
; Подтверждено боевым выводом. blindxfer у Asterisk по умолчанию `#`; боевой
; сервер переопределил его на `##`. atxfer по умолчанию `*2`; боевой — `*02`.
; disconnect по умолчанию `*`; боевой — `**`. Pickup (`*8`) на бою не
; переопределён — совпадает со штатным значением, отдельно объявлять незачем.
blindxfer => ##
atxfer => *02
disconnect => **

[applicationmap]
; Боевые dynamic-фичи — `apprecord` на *1 и `cancel-transfer` на *77.
; `apprecord` подтвердилась 31 июля 2026: боевой `sip show peer` показал у
; тестового пира `Record On/Off feature: apprecord` — то есть это штатный
; peer-level переключатель записи (`recordonfeature`/`recordofffeature` в
; sip.conf), и код *1 просто дёргает его. Само тело фичи в `[applicationmap]`
; (что именно она делает при срабатывании) по-прежнему не видно — команда
; печатает код и имя, а не тело. `cancel-transfer` явно про отмену *02 в
; процессе, но не воспроизведена: выдумывать `Application,${Args}` для
; незнакомой боевой фичи так же не стоит, как раньше не стоило выдумывать код
; для неё.
;
; *3 — конференция, как в старой догадке. В боевом `core show features` такой
; dynamic-фичи нет вообще (ни на *3, ни на другом коде) — не подтверждено,
; что боевой сервер даёт агенту конференцию через DTMF-фичу этого вида.
; Разбор — docs/conference.md. Схема ниже остаётся лабораторным прототипом:
;
;   1. ActivateOn=peer — приложение выполняется на канале собеседника, и он
;      уходит в комнату ${CONFROOM} (переменная унаследована от канала агента,
;      она объявлена через __ в extensions.conf).
;   2. У агента Dial стоит с флагом g, поэтому после ухода собеседника
;      выполнение продолжается со следующего приоритета, где агент заходит в
;      ту же комнату.
;
; Отличить «собеседник ушёл в конференцию» от «собеседник положил трубку»
; помогает CONFBRIDGE_INFO(parties): в первом случае в комнате уже кто-то есть.
conf_pull => *3,peer,ConfBridge,${CONFROOM}

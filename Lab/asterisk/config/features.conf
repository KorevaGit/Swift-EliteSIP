[general]
transferdigittimeout=5
atxfernoanswertimeout=15
atxferdropcall=no
atxferloopdelay=10
atxfercallbackretries=2

[featuremap]
; Коды заданы явно, а не оставлены на встроенные значения, по одной причине:
; боевой код перевода начинается с *0, и любой featuremap, начинающийся с *0
; (например disconnect) будет его перехватывать. Здесь этого не происходит.
blindxfer => ##
atxfer => *2
automixmon => *1
disconnect => *8

;[applicationmap]
; На бою *3 = конференция, а *0<ext># = перевод на горячую раздачу.
; Точное определение этих кодов лежит в боевых features.conf/extensions.conf и
; мне неизвестно, поэтому здесь я их НЕ выдумываю: в M5–M6 они проверяются как
; DTMF-макросы (клиент просто шлёт цифры), а серверную часть возьмём из твоего
; конфига. Если пришлёшь боевые features.conf и релевантный контекст
; extensions.conf — воспроизведу один в один.

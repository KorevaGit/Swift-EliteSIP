services:
  asterisk:
    build: ./asterisk
    container_name: elitesip-lab
    hostname: elitesip-lab
    restart: unless-stopped
    ports:
      - "5060:5060/udp"      # SIP UDP
      - "5061:5061/tcp"      # SIP TLS
      # RTP-диапазон намеренно узкий: публикация UDP-портов на macOS стоит
      # дорого, а для трёх линий больше и не нужно. Совпадает с rtp.conf, и
      # публикуется один в один — Asterisk объявляет в SDP внутренний номер
      # порта, и сдвиг публикации ломает медиа. Из-за этих же портов лаба на 16
      # и лаба на 13 не могут работать одновременно.
      - "10000-10030:10000-10030/udp"
    volumes:
      # Каталог целиком, а не отдельные файлы: bind-mount файла привязан к
      # inode, и после пересоздания файла редактором контейнер продолжает
      # видеть старую версию. Раскладывает файлы по месту entrypoint.sh.
      - ./asterisk/config:/etc/asterisk-elitesip:ro
      - ./certs:/etc/asterisk/keys:ro

; Журнал событий канала (CEL).
;
; Этот файл написан нами, а не FreePBX: FreePBX его не генерирует и не трогает.
; Набор событий подобран под то, что видно в боевых дампах CEL — именно эти
; события показывает страница «Детализация связанных звонков».
;
; Без enable=yes Asterisk не пишет CEL вообще, каким бы полным ни был список
; событий. В комплектном примере cel.conf этой строки нет — отсюда и пустой CEL.

[general]
enable = yes

; dial и queue дают APP_START/APP_END, по которым видно, куда звонок пошёл;
; confbridge понадобится в M6.
apps = dial,park,queue,confbridge

events = CHAN_START,CHAN_END,ANSWER,HANGUP,APP_START,APP_END,BRIDGE_ENTER,BRIDGE_EXIT,LINKEDID_END

dateformat = %F %T

; Оставлено для правок руками — FreePBX создаёт этот файл, но не наполняет.
#include cel_custom.conf

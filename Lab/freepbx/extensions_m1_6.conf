; M1.6 — реальный записываемый разговор для проверки CDR, CEL и MixMonitor.
;
; Номер 600 доступен обычным зарегистрированным расширениям FreePBX. Вызов
; проходит через MixMonitor, а имя файла записывается в CDR. Сервер отвечает,
; воспроизводит фразу и завершает вызов — так проверяется не только наличие
; WAV-заголовка, но и реальный записанный аудиопоток.

[from-internal-custom]
exten => 600,1,Goto(m1-6-recording-demo,600,1)

[m1-6-recording-demo]
exten => 600,1,NoOp(M1.6 recorded CDR/CEL demo)
 same => n,Macro(user-callerid,)
 same => n,Set(CDR(userfield)=M1.6 recorded demo)
 same => n,Set(RECORDING_DATE=${STRFTIME(${EPOCH},,%Y/%m/%d)})
 same => n,Set(RECORDING_STAMP=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)})
 same => n,Set(RECORDING_FILE=demo-${EXTEN}-${CALLERID(number)}-${RECORDING_STAMP}-${UNIQUEID}.wav)
 same => n,TrySystem(/bin/mkdir -p /var/spool/asterisk/monitor/${RECORDING_DATE})
 same => n,Set(CDR(recordingfile)=${RECORDING_FILE})
 same => n,Answer()
 same => n,MixMonitor(/var/spool/asterisk/monitor/${RECORDING_DATE}/${RECORDING_FILE})
 same => n,Playback(demo-congrats)
 same => n,Wait(1)
 same => n,StopMixMonitor()
 same => n,Hangup()

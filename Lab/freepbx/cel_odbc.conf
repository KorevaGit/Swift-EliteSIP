; Запись CEL в базу FreePBX через ODBC.
;
; connection ссылается на DSN, который FreePBX описывает в
; res_odbc_additional.conf, а сам DSN — на драйвер из /etc/odbc.ini. Цепочка
; получается длинной: cel_odbc -> res_odbc -> unixODBC -> драйвер MariaDB.
; Рвётся она чаще всего на последнем звене: если драйвер не собран, конфиг
; выглядит правильным, а таблица остаётся пустой.

[cel]
connection = asteriskcdrdb
table = cel

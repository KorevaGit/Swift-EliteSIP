# Лаборатория на Asterisk 13.38.3 — версии, которая стоит на бою.
#
# Публикуется на других портах, чтобы могла работать рядом с лабой на 16 и
# можно было сравнить поведение двух версий на одном и том же клиенте.
# Конфиги общие: внутри контейнера порты те же 5060/5061.
services:
  asterisk13:
    build:
      context: ./asterisk13
    # Имя закреплено явно: на этот образ опирается FreePBX-лаба (см. freepbx/Dockerfile),
    # а автоматическое имя от compose зависит от имени каталога проекта.
    image: elitesip-asterisk13:13.38.3
    container_name: elitesip-lab13
    hostname: elitesip-lab13
    restart: unless-stopped
    ports:
      - "5070:5060/udp"
      - "5071:5061/tcp"
      # RTP-порты публикуются ОДИН В ОДИН, в отличие от SIP.
      #
      # Asterisk объявляет в SDP свой внутренний номер порта, и сдвинуть
      # публикацию нельзя: клиент отправит медиа на объявленный порт, а на хосте
      # его там не будет. Именно на этом медиа молча не доходило — сигнализация
      # при этом отрабатывала полностью, и звонок выглядел успешным.
      #
      # Следствие: лабы на 13 и на 16 не могут работать одновременно, они
      # спорят за эти порты. SIP-порты у них разные специально, чтобы можно
      # было держать поднятой ту, что нужна сейчас.
      - "10000-10030:10000-10030/udp"
    volumes:
      - ./asterisk/config:/etc/asterisk-elitesip:ro
      - ./certs:/etc/asterisk/keys:ro

# FreePBX — единственный стенд лаборатории (с 31 июля 2026, см. Lab/README.md).
#
# FreePBX генерирует sip.conf, extensions.conf и остальное из своей базы и при
# каждом «Apply Config» перезаписывает их. Ручные добавления (тестовые номера,
# TLS-профиль) поэтому идут через *_custom.conf — файлы, которые FreePBX не
# трогает никогда, — а не правкой сгенерированных файлов напрямую.
services:
  freepbx:
    build:
      context: ./freepbx
    image: elitesip-freepbx:15
    container_name: elitesip-freepbx
    hostname: elitesip-freepbx
    restart: unless-stopped
    environment:
      # Не запоминаем случайный публичный IP машины, где собирался образ.
      FREEPBX_EXTERNAL_ADDRESS: 127.0.0.1
    ports:
      - "8080:80"            # веб-интерфейс FreePBX
      # FreePBX 15 оставляет 5060 под PJSIP, а импортированные chan_sip
      # extensions слушают внутренний 5160. Раньше эти порты публиковались как
      # 5080/5081 — свои, чтобы не спорить с лабой на голом Asterisk. Той лабы
      # больше нет, и обычные 5060/5061 удобнее: сторонние SIP-клиенты
      # подставляют 5060 по умолчанию, а нестандартный порт часть из них либо
      # требует указывать отдельным полем, либо молча игнорирует.
      - "5060:5160/udp"      # SIP UDP
      - "5061:5061/tcp"      # SIP TLS
      # Один в один: номер из SDP обязан совпадать с опубликованным портом.
      - "10200-10230:10200-10230/udp"
    volumes:
      # База и сгенерированные конфиги переживают перезапуск: настройки,
      # сделанные в интерфейсе, не должны исчезать.
      - freepbx-mysql:/var/lib/mysql
      - freepbx-etc:/etc/asterisk
      - freepbx-www:/var/www/html
      # MixMonitor пишет сюда. Без отдельного тома записи исчезают при
      # пересоздании контейнера, хотя строки CDR продолжают ссылаться на них.
      - freepbx-recordings:/var/spool/asterisk/monitor
      # Самоподписанный сертификат для TLS-профиля (M2b). Тот же файл, что был
      # у отдельной лабы на голом Asterisk — сюда переехал вместе с профилем.
      #
      # НЕ /etc/asterisk/keys: тот каталог занят собственным PKI-модулем
      # FreePBX (PKCS.class.php), и read-only mount поверх него роняет
      # fwconsole фатальной ошибкой прав на запись — проверено на живом
      # контейнере, он не поднимался вообще.
      - ./certs:/etc/asterisk/elitesip-keys:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping --silent &&
          asterisk -rx 'core show version' >/dev/null 2>&1 &&
          curl -fsS http://127.0.0.1/admin/config.php >/dev/null
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  freepbx-mysql:
  freepbx-etc:
  freepbx-www:
  freepbx-recordings:
